name: release

# Two ways to release vN (v1, v2, v3...):
# 1. Push a tag vN on main.
# 2. Actions tab > release > Run workflow, enter vN. GitHub creates the tag
#    on the current main commit.
# Both run the tests and publish a GitHub release with the matching
# CHANGELOG.md section as notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag must look like v1 or v1.2. Got: $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $TAG" >&2
            exit 1
          fi
          {
            echo
            echo "## Run"
            echo
            echo '```bash'
            echo 'npm start'
            echo '```'
            echo
            echo 'Then open http://127.0.0.1:3100/ in Chrome. Node 18 or newer. No npm install needed.'
          } >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" --title "ControllerBench $TAG" --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" --title "ControllerBench $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
