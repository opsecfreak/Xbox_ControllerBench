name: release

# Push a tag such as v1, v2, v3 on main. This workflow runs the tests and
# publishes a GitHub release with the matching CHANGELOG.md section as notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo
            echo "## Run"
            echo
            echo '```bash'
            echo 'npm start'
            echo '```'
            echo
            echo 'Then open http://127.0.0.1:3100/ in Chrome. Node 18 or newer. No npm install needed.'
          } >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ControllerBench $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
