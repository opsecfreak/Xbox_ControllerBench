name: release

# Tags: vN for main (v1, v2, v3...), desktop-vN for the desktop-mode branch.
# desktop-vN releases are marked as pre-releases.
# Two ways to release:
# 1. Push a tag vN on main.
# 2. Actions tab > release > Run workflow, enter vN. GitHub creates the tag
#    on the current main commit.
# Both run the tests and publish a GitHub release with the matching
# CHANGELOG.md section as notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v4 (main) or desktop-v1 (desktop-mode branch)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^(desktop-)?v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag must look like v1, v1.2 or desktop-v1. Got: $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == desktop-* ]]; then
            echo "PRE=--prerelease" >> "$GITHUB_ENV"
            echo "TITLE=ControllerBench Desktop mode ${TAG#desktop-}" >> "$GITHUB_ENV"
          else
            echo "PRE=" >> "$GITHUB_ENV"
            echo "TITLE=ControllerBench $TAG" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $TAG" >&2
            exit 1
          fi
          {
            echo
            echo "## Run"
            echo
            echo '```bash'
            echo 'npm start'
            echo '```'
            echo
            echo 'Then open http://127.0.0.1:3100/ in Chrome. Node 18 or newer. No npm install needed.'
            if [[ "$TAG" == desktop-* ]]; then
              echo
              echo 'Desktop mode (Windows): run `npm run desktop`, then open http://127.0.0.1:3100/desktop.html for settings.'
              echo 'Hold View + Menu for 1 s to pause. Guide: docs/DESKTOP.md.'
            fi
            echo
            echo 'License: MIT.'
          } >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --verify-tag $PRE
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" $PRE
          fi
