<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <title>Xbox One controller: button names and Gamepad API index numbers used by ControllerBench</title>
  <rect width="640" height="400" rx="16" fill="#ffffff"/>
  <!-- body -->
  <path d="M170 110 Q320 80 470 110 Q560 125 590 250 Q610 340 545 350 Q505 355 470 300 Q440 262 320 262 Q200 262 170 300 Q135 355 95 350 Q30 340 50 250 Q80 125 170 110 Z" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <!-- bumpers / triggers -->
  <path d="M130 112 Q170 92 230 92 L232 104 Q175 106 140 122 Z" fill="#ced4da" stroke="#495057"/>
  <path d="M510 112 Q470 92 410 92 L408 104 Q465 106 500 122 Z" fill="#ced4da" stroke="#495057"/>
  <text x="70" y="70" fill="#212529">LT (6) analog</text>
  <text x="70" y="88" fill="#212529">LB (4)</text>
  <text x="470" y="70" fill="#212529">RT (7) analog</text>
  <text x="520" y="88" fill="#212529">RB (5)</text>
  <line x1="130" y1="92" x2="165" y2="100" stroke="#868e96"/>
  <line x1="510" y1="92" x2="475" y2="100" stroke="#868e96"/>
  <!-- left stick -->
  <circle cx="175" cy="170" r="30" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
  <text x="138" y="160" fill="#212529" text-anchor="end">Left stick</text>
  <text x="138" y="176" fill="#495057" font-size="11" text-anchor="end">axes 0, 1</text>
  <text x="138" y="190" fill="#495057" font-size="11" text-anchor="end">click (10)</text>
  <!-- d-pad -->
  <rect x="227" y="200" width="16" height="48" fill="#adb5bd" stroke="#495057"/>
  <rect x="211" y="216" width="48" height="16" fill="#adb5bd" stroke="#495057"/>
  <text x="266" y="214" fill="#212529">D-pad</text>
  <text x="266" y="229" fill="#495057" font-size="11">up 12 · down 13</text>
  <text x="266" y="243" fill="#495057" font-size="11">left 14 · right 15</text>
  <!-- right stick -->
  <circle cx="405" cy="225" r="30" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
  <text x="442" y="238" fill="#212529">Right stick</text>
  <text x="442" y="253" fill="#495057" font-size="11">axes 2, 3 · click (11)</text>
  <!-- face buttons -->
  <circle cx="470" cy="195" r="13" fill="#40c057" stroke="#2b8a3e"/><text x="465" y="200" fill="#fff" font-weight="700">A</text>
  <circle cx="498" cy="168" r="13" fill="#fa5252" stroke="#c92a2a"/><text x="493" y="173" fill="#fff" font-weight="700">B</text>
  <circle cx="442" cy="168" r="13" fill="#339af0" stroke="#1c7ed6"/><text x="437" y="173" fill="#fff" font-weight="700">X</text>
  <circle cx="470" cy="141" r="13" fill="#fcc419" stroke="#e67700"/><text x="465" y="146" fill="#212529" font-weight="700">Y</text>
  <text x="520" y="200" fill="#495057" font-size="11">A 0 · B 1</text>
  <text x="520" y="215" fill="#495057" font-size="11">X 2 · Y 3</text>
  <!-- center -->
  <circle cx="320" cy="132" r="17" fill="#ced4da" stroke="#495057"/><text x="320" y="136" fill="#212529" font-size="11" text-anchor="middle">Xbox</text>
  <rect x="270" y="172" width="20" height="12" rx="6" fill="#ced4da" stroke="#495057"/>
  <rect x="350" y="172" width="20" height="12" rx="6" fill="#ced4da" stroke="#495057"/>
  <text x="280" y="166" fill="#212529" font-size="11" text-anchor="middle">View (8)</text>
  <text x="360" y="166" fill="#212529" font-size="11" text-anchor="middle">Menu (9)</text>
  <text x="342" y="128" fill="#495057" font-size="11">(16)</text>
  <!-- chatpad port -->
  <rect x="300" y="255" width="40" height="7" fill="#868e96"/>
  <line x1="320" y1="262" x2="320" y2="312" stroke="#868e96"/>
  <text x="320" y="328" fill="#212529" text-anchor="middle">Chatpad and headset port (bottom edge)</text>
  <text x="20" y="390" fill="#868e96" font-size="11">Diagram for ControllerBench. Numbers are W3C standard gamepad indexes. Not to scale.</text>
</svg>
