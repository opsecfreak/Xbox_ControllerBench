<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14">
  <title>Xbox One controller: button names and Gamepad API index numbers used by ControllerBench</title>
  <defs>
    <radialGradient id="body" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </radialGradient>
    <radialGradient id="cap" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4a4d53"/>
      <stop offset="1" stop-color="#232427"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="460" rx="16" fill="#ffffff"/>
  <g transform="translate(120,0)">

  <!-- bumpers -->
  <path d="M148 132 C176 98 236 80 302 76 L304 92 C244 96 192 112 162 140 Z" fill="#2a2c30" stroke="#111" stroke-width="1.5"/>
  <path d="M612 132 C584 98 524 80 458 76 L456 92 C516 96 568 112 598 140 Z" fill="#2a2c30" stroke="#111" stroke-width="1.5"/>

  <!-- body -->
  <path d="M210 95 C262 80 498 80 550 95 C612 112 652 150 676 232 C706 332 700 398 650 407 C610 414 585 388 560 348 C536 308 506 292 470 292 L290 292 C254 292 224 308 200 348 C175 388 150 414 110 407 C60 398 54 332 84 232 C108 150 148 112 210 95 Z"
        fill="url(#body)" stroke="#0d0d0f" stroke-width="2"/>

  <!-- Xbox button -->
  <circle cx="380" cy="122" r="21" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
  <circle cx="380" cy="122" r="14" fill="#2f3136"/>
  <path d="M371 113 L389 131 M389 113 L371 131" stroke="#e9ecef" stroke-width="4" stroke-linecap="round"/>

  <!-- View and Menu -->
  <circle cx="335" cy="178" r="10" fill="#26282c" stroke="#5c6066" stroke-width="1.5"/>
  <rect x="329" y="173" width="7" height="6" fill="none" stroke="#cfd3d8" stroke-width="1.2"/>
  <rect x="333" y="176" width="7" height="6" fill="none" stroke="#cfd3d8" stroke-width="1.2"/>
  <circle cx="425" cy="178" r="10" fill="#26282c" stroke="#5c6066" stroke-width="1.5"/>
  <path d="M419 174 H431 M419 178 H431 M419 182 H431" stroke="#cfd3d8" stroke-width="1.5"/>
  <text x="335" y="160" fill="#cfd3d8" font-size="11" text-anchor="middle">View (8)</text>
  <text x="425" y="160" fill="#cfd3d8" font-size="11" text-anchor="middle">Menu (9)</text>

  <!-- left stick (upper left) -->
  <circle cx="232" cy="168" r="38" fill="#141517" stroke="#000"/>
  <circle cx="232" cy="168" r="28" fill="url(#cap)" stroke="#5c6066"/>
  <circle cx="232" cy="168" r="18" fill="none" stroke="#3d4045" stroke-width="2"/>

  <!-- d-pad (lower left) -->
  <circle cx="306" cy="242" r="36" fill="#141517" stroke="#000"/>
  <path d="M296 214 H316 V232 H334 V252 H316 V270 H296 V252 H278 V232 H296 Z" fill="#3a3d42" stroke="#6c7076" stroke-width="1.5"/>

  <!-- right stick (lower right) -->
  <circle cx="454" cy="242" r="38" fill="#141517" stroke="#000"/>
  <circle cx="454" cy="242" r="28" fill="url(#cap)" stroke="#5c6066"/>
  <circle cx="454" cy="242" r="18" fill="none" stroke="#3d4045" stroke-width="2"/>

  <!-- face buttons (upper right) -->
  <circle cx="530" cy="136" r="16" fill="#1b1c1f" stroke="#000"/><text x="530" y="142" fill="#fcc419" font-weight="700" text-anchor="middle" font-size="16">Y</text>
  <circle cx="497" cy="168" r="16" fill="#1b1c1f" stroke="#000"/><text x="497" y="174" fill="#339af0" font-weight="700" text-anchor="middle" font-size="16">X</text>
  <circle cx="563" cy="168" r="16" fill="#1b1c1f" stroke="#000"/><text x="563" y="174" fill="#ff6b6b" font-weight="700" text-anchor="middle" font-size="16">B</text>
  <circle cx="530" cy="200" r="16" fill="#1b1c1f" stroke="#000"/><text x="530" y="206" fill="#51cf66" font-weight="700" text-anchor="middle" font-size="16">A</text>

  <!-- chatpad / headset port -->
  <rect x="352" y="285" width="56" height="7" rx="2" fill="#5c6066"/>

  </g>
  <!-- labels and leader lines -->
  <g stroke="#adb5bd" stroke-width="1.2" fill="none">
    <path d="M150 52 L316 92"/>
    <path d="M850 52 L684 92"/>
    <path d="M500 54 L500 100"/>
    <path d="M190 168 L313 168"/>
    <path d="M150 262 L396 248"/>
    <path d="M840 262 L613 248"/>
    <path d="M840 168 L700 168"/>
    <path d="M500 292 L500 412"/>
  </g>
  <g fill="#212529">
    <text x="24" y="30">LT (6) analog trigger</text>
    <text x="24" y="48">LB (4) bumper</text>
    <text x="976" y="30" text-anchor="end">RT (7) analog trigger</text>
    <text x="976" y="48" text-anchor="end">RB (5) bumper</text>
    <text x="500" y="46" text-anchor="middle">Xbox button (16)</text>
    <text x="24" y="164">Left stick</text>
    <text x="24" y="182" fill="#495057" font-size="12">axes 0, 1 · click (10)</text>
    <text x="24" y="266">D-pad</text>
    <text x="24" y="284" fill="#495057" font-size="12">up 12 · down 13</text>
    <text x="24" y="300" fill="#495057" font-size="12">left 14 · right 15</text>
    <text x="976" y="164" text-anchor="end">Face buttons</text>
    <text x="976" y="182" fill="#495057" font-size="12" text-anchor="end">A 0 · B 1 · X 2 · Y 3</text>
    <text x="976" y="266" text-anchor="end">Right stick</text>
    <text x="976" y="284" fill="#495057" font-size="12" text-anchor="end">axes 2, 3 · click (11)</text>
    <text x="500" y="430" text-anchor="middle">Chatpad and headset port (bottom edge)</text>
  </g>
  <text x="24" y="452" fill="#868e96" font-size="11">Diagram for ControllerBench. Numbers are W3C standard gamepad indexes. Not to scale.</text>
</svg>
